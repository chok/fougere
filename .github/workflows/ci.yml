name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A test that leaks a server process hangs the job rather than failing it, and
    # the default ceiling is six hours of a runner saying nothing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the packages' tests import each other's dist/, and a
      # fixture that boots a project outside any workspace loads it by path.
      #
      # Packages only. Unfiltered, this also ran `nuxt build`, `next build`,
      # `vite build` and `react-router build` across six front-ends that no test
      # reads — `pages.yml` already spelled the filter for the same reason.
      - run: pnpm run build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # The scan cache is keyed on source hashes, not on the parser's version —
      # a cold run is the only one that proves the parser itself still agrees.
      #
      # The CACHE is one file. Deleting the whole `.fougere/` directory also removed
      # `remotes.json` and the synced entities beside it, which are not caches at all —
      # what a consumer holds of a remote frond, and what one fixture is made of.
      - name: tests, cold scan cache
        run: |
          find . -path '*/.fougere/scan-cache.json' -not -path '*/node_modules/*' -delete
          pnpm -r test

      # Mechanical readings, NOT gates — same posture as `audit` below, for the same
      # reason: a job that turns red on a finding forces the finding to be cleared in
      # bulk, and clearing in bulk is how this repo grew code nobody had read. They
      # record a baseline a human moves deliberately, one package at a time.
      #
      # They live in THIS job rather than their own because `knip.ts` derives its
      # entry globs from `FROND_DIRS` in core, and importing core's source resolves
      # `@fougere/schema` through its `dist/`. A separate job that only installed
      # loaded no config at all — which is how this first shipped, and how it broke.

      # Warnings exit 0 on their own; only a genuine error stops this.
      - run: pnpm lint

      # `--no-exit-code` is what makes this a reading. The finding that pays for
      # the step is `unlisted`: a package importing what its package.json never
      # declares works in the workspace and breaks once published.
      - run: pnpm knip --no-exit-code

      # Two GATES, unlike the readings above, and for the reason they are not: neither
      # asks a judgment call, and both start green, so there is nothing to clear in bulk.
      # Both need `dist/`, so they run after build.
      #
      # `publish:check` — a subpath naming a file absent from the tarball.
      # `arch` — the six invariants this repo used to state in prose only.
      - run: pnpm publish:check

      # `publish:check` asks what a tarball PROMISES in its `exports`. This asks what it
      # RESOLVES once installed: it packs every package, scaffolds outside the workspace
      # and boots the result. Four published versions shipped a Nuxt module pointing at
      # uncompiled `.ts`, which every workspace-reading check saw as fine.
      - run: pnpm door:check

      - run: pnpm arch

      # `arch` asks what a file REACHES; this asks where it LIVES — a family that
      # depends on a family depending back. Needs no build: it reads `src/` alone.
      - run: pnpm arch:cycles

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Informational, NOT a gate. Every high/critical left in the prod tree
      # comes from `better-auth > next` and `better-auth > vitest` — framework
      # integrations better-auth declares and Fougere never loads. Gating on
      # them would paint CI red for code we do not execute. Read it when
      # raising a floor; the floors we own (kysely, better-auth) are pinned
      # above their advisories.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
