name: Pages

# The site prerendered to static hosting. What survives the export: the landing
# page, the docs (en/fr), and the blog's READ side — rendered by the Frond at
# build time. What does not: writing and signing in, which need a server. See
# site/README.md#static.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      # The build resolves through the workspace root: its deps and its
      # package manager are inputs too.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # enablement: turns Pages on for the repo on the first run, rather than
      # asking for a checkbox in the settings before the workflow can pass.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm install --frozen-lockfile

      # The site consumes @fougere/* through their dist/.
      - run: pnpm -r --filter './packages/**' build

      # nuxt is invoked directly rather than through `pnpm run`: a Fougere app
      # carries its own pnpm-workspace.yaml (that is the shape the CLI ships),
      # so running a script inside site/ makes pnpm verify a nested workspace
      # that has never been installed on its own — and it then tries to resolve
      # @fougere/* there, where they do not live. The frozen install above
      # already pinned every dependency.
      - name: generate
        working-directory: site
        # The site is served at the apex of its own domain, so the base path is
        # the root. It was the repo name while the site lived under
        # chok.github.io/fougere/ — keeping that derivation once a custom domain
        # is set points every asset at /fougere/_nuxt/, which 404s.
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: ./node_modules/.bin/nuxt generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
