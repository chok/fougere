# yaml-language-server: $schema=https://fougere.dev/schema/topology.json
# The whole topology statement, and the only thing this demo asks you to change.
#
# As written, cart, pricing and catalog run in the app and `cart.checkout` costs nothing but
# function calls. Uncomment a line and the SAME code pays a round trip for it.
#
# `ledger` is placed and nothing serves it, on purpose: a dependency the topology declares and
# no process ever answers is the one thing a counted graph cannot report.
processes:
  # pricing: { url: http://127.0.0.1:4610, fronds: [pricing] }
  # catalog: { url: http://127.0.0.1:4620, fronds: [catalog] }
  ledger: { url: http://127.0.0.1:4630, fronds: [ledger] }
