# From the monorepo root:  docker compose -f site/docker-compose.yml up -d --build
services:
  # The release step: the site's boot reads the schema and refuses a database behind it, so the
  # database is brought up here first — from the build stage, the one holding the sources the
  # migration reads.
  migrate:
    build:
      context: ..
      dockerfile: site/Dockerfile
      target: build
    command: ["pnpm", "-C", "site", "migrate"]
    volumes:
      - site-data:/repo/site/.data

  site:
    build:
      context: ..
      dockerfile: site/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Public origin of the deployment — better-auth validates it.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Required in production: any string of 32+ characters.
      SITE_AUTH_SECRET: ${SITE_AUTH_SECRET:?set SITE_AUTH_SECRET in .env}
    volumes:
      # All writable state (SQLite db + content index) lives here.
      - site-data:/app/.data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  site-data:
