packages:
  - packages/*
  - packages/app/*
  - packages/transport/*
  - demos/*
  - site
  - demos/multi-frond/remote-blog
  - demos/multi-frond/consumer
  - demos/emit-multirepo/blog
  - demos/emit-multirepo/search

# pnpm 10 moved these out of package.json and pnpm 11 stopped reading them
# there — silently, so `--frozen-lockfile` saw no overrides at all and refused
# a lockfile that records one.
overrides:
  graphql: ^16.13.1

# pnpm 11 fails an install rather than warning about a build script it was not
# told to run, and it renamed the allowlist: onlyBuiltDependencies (a list) is
# now allowBuilds (a map). Every entry builds something real — native bindings,
# a binary, or a postinstall that picks a variant.
allowBuilds:
  better-sqlite3: true
  '@swc/core': true
  esbuild: true
  sharp: true
  '@parcel/watcher': true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.25'
  - '@tanstack/react-start-client@1.168.23'
  - '@tanstack/react-start-rsc@0.1.41'
  - '@tanstack/react-start-server@1.167.30'
  - '@tanstack/react-start@1.168.42'
  - '@tanstack/router-core@1.171.21'
  - '@tanstack/router-generator@1.167.27'
  - '@tanstack/router-plugin@1.168.29'
  - '@tanstack/start-client-core@1.170.21'
  - '@tanstack/start-plugin-core@1.171.33'
  - '@tanstack/start-server-core@1.169.25'
  - '@tanstack/start-storage-context@1.167.23'
